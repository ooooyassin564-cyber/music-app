<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أغاني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1733;--bg2:#10244d;--card:#162f64;--line:#2a4a8c;--text:#eef3ff;--mute:#9fb4e0;--acc:#7ee0c3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;background:linear-gradient(180deg,var(--bg2),var(--bg) 60%);color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.search{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:18px}
.feat{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:22px;width:100%;text-align:right}
.feat img{width:92px;height:92px;border-radius:50%;object-fit:cover}
.feat small{color:var(--acc);font-size:13px}
.feat b{display:block;font-size:20px;margin:4px 0}
.feat span{color:var(--mute);font-size:14px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;width:100%;text-align:right}
.row:hover,.row.on{background:var(--card)}
.row img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.row b{display:block;font-size:16px}.row span{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:30px 0;line-height:1.8}
#player{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg2),var(--bg));overflow:auto;padding:16px;transform:translateY(100%);transition:transform .3s;z-index:5}
#player.open{transform:none}
.pw{max-width:480px;margin:auto;text-align:center}
.close{display:block;margin-inline-start:auto;font-size:15px;color:var(--mute);padding:6px}
.disc{width:min(68vw,270px);aspect-ratio:1;border-radius:50%;margin:14px auto 22px;position:relative;box-shadow:0 0 0 10px var(--card),0 20px 50px #0008;animation:spin 14s linear infinite;animation-play-state:paused}
.disc.play{animation-play-state:running}
.disc img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.disc:after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
#t{font-size:24px;font-weight:800}#a{color:var(--mute);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--acc);margin:20px 0 2px;direction:ltr}
.tm{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;direction:ltr}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px;margin:14px 0 20px;direction:ltr}
.ctl button{font-size:26px;width:48px;height:48px;border-radius:50%}
.ctl .pp{width:68px;height:68px;background:var(--acc);color:var(--bg);font-size:28px}
.lyr{background:var(--card);border-radius:18px;padding:18px;line-height:2.1;white-space:pre-wrap;font-size:17px;max-height:240px;overflow:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>أغاني</h1></div>
  <input class="search" id="q" type="search" placeholder="ابحث عن أغنية أو فنان…" aria-label="بحث">
  <div id="home"></div>
</div>

<section id="player" aria-label="التشغيل">
  <div class="pw">
    <button class="close" id="closeBtn">إغلاق ⌄</button>
    <div class="disc" id="disc"><img id="cov" alt=""></div>
    <div id="t"></div><div id="a"></div>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="موضع التشغيل">
    <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="prev" aria-label="السابق">⏮</button>
      <button class="pp" id="pp" aria-label="تشغيل">▶</button>
      <button id="next" aria-label="التالي">⏭</button>
    </div>
    <div class="lyr" id="lyr"></div>
  </div>
</section>

<script>
const API = "";
let all_songs = [], list = [];
const all = () => list;
const full = u => !u ? "" : /^(https?:|data:)/.test(u) ? u : API + u;
async function load_songs(){
  try { all_songs = await (await fetch("songs.json")).json(); }
  catch (e) { $("home").innerHTML = '<p class="empty">تعذر تحميل ملف songs.json</p>'; return; }
  search($("q").value);
}
function search(q = ""){
  q = q.trim().toLowerCase();
  list = all_songs.filter(s => [s.title, s.artist, s.lyrics].some(v => (v || "").toLowerCase().includes(q)));
  render();
}
const $ = id => document.getElementById(id);
const audio = new Audio();
let i = 0;
const ph = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a4a8c"/><text x="50" y="64" font-size="46" text-anchor="middle" fill="#7ee0c3">♪</text></svg>');
const img = s => s.cover ? full(s.cover) : ph;
const fmt = n => isFinite(n) ? Math.floor(n/60) + ":" + String(Math.floor(n%60)).padStart(2,"0") : "0:00";

function render(){
  const L = all(), h = $("home");
  if(!L.length){ h.innerHTML = '<p class="empty">مفيش نتائج.</p>'; return; }
  h.innerHTML = '<button class="feat" data-i="0"><img src="'+img(L[0])+'" alt=""><div><small>اسمع الآن</small><b>'+L[0].title+'</b><span>'+(L[0].artist||"")+'</span></div></button>' +
    L.map((s,k)=>'<button class="row'+(k===i&&audio.src?" on":"")+'" data-i="'+k+'"><img src="'+img(s)+'" alt=""><div><b>'+s.title+'</b><span>'+(s.artist||"")+'</span></div></button>').join("");
}
function load(k, play){
  const L = all(); if(!L.length) return;
  i = (k + L.length) % L.length;
  const s = L[i];
  audio.src = full(s.src);
  $("t").textContent = s.title; $("a").textContent = s.artist || "";
  $("cov").src = img(s); $("lyr").textContent = s.lyrics || "مفيش كلمات لهذه الأغنية.";
  if(play) audio.play().catch(()=>{});
  render();
}
$("home").onclick = e => { const b = e.target.closest("[data-i]"); if(!b) return; load(+b.dataset.i, true); $("player").classList.add("open"); };
$("closeBtn").onclick = () => $("player").classList.remove("open");
$("pp").onclick = () => audio.paused ? audio.play().catch(()=>{}) : audio.pause();
$("next").onclick = () => load(i+1, true);
$("prev").onclick = () => load(i-1, true);
audio.onplay = audio.onpause = () => { const p = !audio.paused; $("pp").textContent = p ? "⏸" : "▶"; $("disc").classList.toggle("play", p); };
audio.onended = () => load(i+1, true);
audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
audio.ontimeupdate = () => { $("cur").textContent = fmt(audio.currentTime); if(audio.duration) $("seek").value = audio.currentTime / audio.duration * 100; };
$("seek").oninput = e => { if(audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };

$("q").oninput = e => search(e.target.value);
load_songs();
</script>
</body>
</html>
